# Local setup: the MCP server behind a Caddy reverse proxy (docs/runbook.md).
# Create .env from .env.example first; .env is never committed.
#
#   docker compose up --build
#
# The MCP endpoint is then http://127.0.0.1:8080/mcp.

services:
  server:
    build: .
    image: gemini-search-mcp:local
    # Required file: compose stops with an error when .env is missing.
    env_file: .env
    # Take precedence over blank values copied from .env.example, which the
    # server would treat as unset (ADR 0010). Caddy expects port 8000.
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    # Reachable from the proxy only, no published port.
    expose:
      - "8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      # Local access only; publish on another address deliberately.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
