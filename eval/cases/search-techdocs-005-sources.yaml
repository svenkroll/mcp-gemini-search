id: search-techdocs-005-sources
tool: search
category: tech_docs
input:
  query: |-
    According to the git-stash documentation, which subcommand applies a stashed state and removes it from the stash list?

    Answer only from Google Search results. Cite the primary source of truth (official documentation, standards body or publisher of record) where the answer can be checked.
expected: git stash pop removes a single stashed state from the stash list and applies it on top of the current working tree.
allowed_sources:
- git-scm.com
ground_truth_date: 2026-11-12
expected_outcome: answer_with_sources
