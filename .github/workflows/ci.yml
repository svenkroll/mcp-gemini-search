name: ci

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: |
          curl -LsSf --retry 3 -o /tmp/uv.tar.gz \
            https://github.com/astral-sh/uv/releases/download/0.13.7/uv-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install -m 755 /tmp/uv-x86_64-unknown-linux-musl/uv /tmp/uv-x86_64-unknown-linux-musl/uvx /usr/local/bin/
          uv --version

      - name: Install Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        run: make test

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: gemini-search-mcp:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hadolint
        run: |
          curl -fsSL --retry 3 -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  /tmp/hadolint" | sha256sum --check --strict
          install -m 755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version

      - name: Install Trivy
        run: |
          curl -fsSL --retry 3 -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  /tmp/trivy.tar.gz" | sha256sum --check --strict
          mkdir /tmp/trivy
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy trivy
          install -m 755 /tmp/trivy/trivy /usr/local/bin/trivy
          trivy --version

      - name: Lint Dockerfile
        run: hadolint Dockerfile

      - name: Set up multi-arch builder
        run: |
          docker run --privileged --rm \
            tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 \
            --install arm64
          docker buildx create --name ci-builder --driver docker-container \
            --driver-opt image=moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb \
            --use
          docker buildx inspect --bootstrap

      - name: Build linux/amd64 and linux/arm64
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --output type=cacheonly --file Dockerfile .

      - name: Build linux/amd64 image for scan and smoke test
        run: |
          docker buildx build --platform linux/amd64 --load --tag "$IMAGE" --file Dockerfile .

      - name: Scan image with Trivy
        run: |
          trivy image --no-progress --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$IMAGE"

      - name: Smoke test
        run: |
          set -euo pipefail
          # Dummy configuration, not a secret. The token has 41 characters.
          token="ci-smoke-$(printf '%032d' 0)"

          # The image runs as a numeric non-root user.
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"

          # Without GEMINI_API_KEY the container exits with code 2 and names the variable.
          status=0
          docker run --rm -e MCP_BEARER_TOKEN="$token" "$IMAGE" >/tmp/missing-key.log 2>&1 || status=$?
          cat /tmp/missing-key.log
          test "$status" -eq 2
          grep -q GEMINI_API_KEY /tmp/missing-key.log

          # With a dummy configuration and a read-only root filesystem it serves requests.
          docker run --detach --name smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges --publish 127.0.0.1:8000:8000 \
            -e GEMINI_API_KEY=dummy-key-for-smoke-test -e MCP_BEARER_TOKEN="$token" "$IMAGE"
          trap 'docker logs smoke; docker rm --force smoke' EXIT

          ready=000
          for _ in $(seq 1 30); do
            ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready || true)
            test "$ready" = 200 && break
            sleep 1
          done
          echo "/health/ready: $ready"
          test "$ready" = 200

          unauthorized=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8000/mcp)
          echo "/mcp without token: $unauthorized"
          test "$unauthorized" = 401

          # Neither secret value may appear in the container log.
          docker logs smoke >/tmp/smoke.log 2>&1
          if grep -q -e "$token" -e dummy-key-for-smoke-test /tmp/smoke.log; then
            echo "secret value found in the container log"
            exit 1
          fi

      - name: Proxy test, tool call longer than 60 seconds through Caddy
        run: |
          set -euo pipefail
          # Stub backend reachable as server:8000, like the server in compose.yaml. It
          # answers /mcp only after 75 s, with one event-stream chunk that echoes the
          # MCP headers it received. /ready answers at once for the start-up wait.
          cat >/tmp/stub.py <<'PY'
          import http.server
          import json
          import time


          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/mcp":
                      self.send_error(404)
                      return
                  time.sleep(75)
                  body = json.dumps(
                      {
                          "protocol": self.headers.get("MCP-Protocol-Version"),
                          "method": self.headers.get("Mcp-Method"),
                          "name": self.headers.get("Mcp-Name"),
                      },
                      separators=(",", ":"),
                  )
                  self.send_response(200)
                  self.send_header("Content-Type", "text/event-stream")
                  self.end_headers()
                  self.wfile.write(f"event: message\ndata: {body}\n\n".encode())

              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Length", "0")
                  self.end_headers()


          http.server.ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
          PY
          trap 'docker logs caddy || true; docker rm --force server caddy || true; docker network rm ec3 || true' EXIT
          docker network create ec3
          docker run --detach --name server --network ec3 --entrypoint python             --volume /tmp/stub.py:/stub.py:ro "$IMAGE" -u /stub.py
          caddy_image=$(sed -n 's/^    image: \(caddy:.*\)$/\1/p' compose.yaml)
          echo "Caddy image: $caddy_image"
          docker run --detach --name caddy --network ec3 --publish 127.0.0.1:8080:8080             --volume "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy_image"

          ready=000
          for _ in $(seq 1 30); do
            ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ready || true)
            test "$ready" = 200 && break
            sleep 1
          done
          test "$ready" = 200

          # Caddy must keep the request open past 60 s and pass the MCP headers unchanged.
          curl -sS --max-time 120 -X POST \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' -H 'Mcp-Name: search' \
            -o /tmp/proxied.body -w '%{http_code} %{time_total}\n' \
            http://127.0.0.1:8080/mcp | tee /tmp/proxied.status
          read -r code seconds < /tmp/proxied.status
          test "$code" = 200
          test "${seconds%.*}" -ge 70
          printf 'event: message\ndata: {"protocol":"2026-07-28","method":"tools/call","name":"search"}\n\n' \
            >/tmp/proxied.expected
          diff /tmp/proxied.expected /tmp/proxied.body
